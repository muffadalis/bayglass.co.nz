name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies (Tailwind CSS)
        run: npm ci

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Matches the version developed and tested against locally.
          # Hugo 0.158+ sandboxes the css.TailwindCSS subprocess; the
          # `[security.exec] allow` list in hugo.toml whitelists the
          # Tailwind CLI so the build works on this version and newer.
          hugo-version: "0.165.0"
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
