<!-- @dsCard group="Spacing" viewport="700x160" name="Radii & shadows" subtitle="Corner rounding and ambient elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); padding: 24px; display: flex; gap: 20px; align-items: center; }
  .box { width: 90px; height: 70px; background: var(--surface-card); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 10px; color: var(--text-muted); }
  .r-md { border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .r-lg { border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
  .r-xl { border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); }
  .r-2xl { border-radius: var(--radius-2xl); box-shadow: var(--shadow-ring); }
</style>
</head>
<body>
  <div class="box r-md">md · sm</div>
  <div class="box r-lg">lg · md</div>
  <div class="box r-xl">xl · lg</div>
  <div class="box r-2xl">2xl · ring</div>
</body>
</html>
