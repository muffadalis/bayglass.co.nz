<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 22px; }
  .r { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar { height: 14px; background: var(--color-primary); border-radius: 3px; }
  .n { font-size: 11px; color: var(--text-muted); width: 120px; }
</style>
</head>
<body>
  <div class="r"><span class="n">space-2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="r"><span class="n">space-4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="r"><span class="n">space-6 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="r"><span class="n">space-8 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="r"><span class="n">space-10 · 64px</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
