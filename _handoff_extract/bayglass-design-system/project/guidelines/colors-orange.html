<!-- @dsCard group="Colors" viewport="700x150" name="Warm ramp (gold → orange)" subtitle="Accent scale for CTAs and highlights" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 70px; border-radius: var(--radius-sm); box-shadow: var(--shadow-ring); }
  .n { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--orange-300)"></div><div class="n">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="n">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-500)"></div><div class="n">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-600)"></div><div class="n">600</div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-700)"></div><div class="n">700</div></div>
  </div>
</body>
</html>
