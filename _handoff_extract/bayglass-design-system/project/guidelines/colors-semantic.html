<!-- @dsCard group="Colors" viewport="700x180" name="Semantic aliases" subtitle="How the palette maps to roles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-ring); }
  .chip { height: 46px; }
  .lab { padding: 6px 8px; font-size: 10px; color: var(--text-body); }
  .lab b { display: block; color: var(--text-heading); font-size: 11px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><div class="lab"><b>primary</b>blue-500</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-accent)"></div><div class="lab"><b>accent</b>orange</div></div>
    <div class="sw"><div class="chip" style="background:var(--text-heading)"></div><div class="lab"><b>heading</b>navy</div></div>
    <div class="sw"><div class="chip" style="background:var(--text-body)"></div><div class="lab"><b>body</b>#3a4c56</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="lab"><b>page</b>neutral-50</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-subtle)"></div><div class="lab"><b>card</b>white</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-dark)"></div><div class="lab"><b>dark</b>navy</div></div>
    <div class="sw"><div class="chip" style="background:var(--border-subtle)"></div><div class="lab"><b>border</b>neutral-200</div></div>
  </div>
</body>
</html>
