<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="../styles.css">

  .lg { font-size: 30px; font-weight: 500; letter-spacing: -.03em; margin-top: 10px; }

</style>
</head>
<body>
  <div class="xl">More than just glass.</div>
  <div class="lg">Frameless glass showers</div>
