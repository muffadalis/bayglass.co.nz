<!-- @dsCard group="Colors" viewport="700x150" name="Brand palette" subtitle="The seven core Bayglass swatches, cool → warm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-card); padding: 20px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-ring); }
  .chip { height: 64px; }
  .lab { padding: 6px 8px; font-size: 11px; color: var(--text-body); }
  .lab b { display: block; color: var(--text-heading); font-size: 11px; letter-spacing: .02em; }
  code { font-family: var(--font-body); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#8ecae6"></div><div class="lab"><b>Sky</b><code>#8ecae6</code></div></div>
    <div class="sw"><div class="chip" style="background:#219ebc"></div><div class="lab"><b>Blue</b><code>#219ebc</code></div></div>
    <div class="sw"><div class="chip" style="background:#126782"></div><div class="lab"><b>Teal</b><code>#126782</code></div></div>
    <div class="sw"><div class="chip" style="background:#023047"></div><div class="lab"><b>Navy</b><code>#023047</code></div></div>
    <div class="sw"><div class="chip" style="background:#ffb703"></div><div class="lab"><b>Gold</b><code>#ffb703</code></div></div>
    <div class="sw"><div class="chip" style="background:#fd9e02"></div><div class="lab"><b>Amber</b><code>#fd9e02</code></div></div>
    <div class="sw"><div class="chip" style="background:#fb8500"></div><div class="lab"><b>Orange</b><code>#fb8500</code></div></div>
  </div>
</body>
</html>
