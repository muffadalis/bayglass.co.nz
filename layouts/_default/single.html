{{ define "main" }}

{{ partial "gradient-header.html" (dict "eyebrow" .Params.eyebrow "title" .Title "lead" .Params.summary) }}

<div class="container-page mt-20 max-w-2xl">
  {{ with .Params.image }}
  <div class="media-frame aspect-video mb-10">
    <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="media-cover" loading="lazy">
  </div>
  {{ end }}
  <div class="prose-body">
    {{ .Content }}
  </div>
</div>

{{ partial "cta-footer.html" . }}

{{ end }}
