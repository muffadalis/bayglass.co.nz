{{/* Bento-grid feature tile, always a link. Params: eyebrow, title, body, media (image URL), dark (bool), href. */}}
{{ $dark := .dark }}
<a href="{{ .href }}" class="flex flex-col rounded-lg overflow-hidden no-underline {{ if $dark }}bg-surface-dark-2 border border-white/10{{ else }}bg-surface-card border border-hairline shadow-md{{ end }}">
  {{ with .media }}
  <div class="relative w-full aspect-[16/10] overflow-hidden {{ if $dark }}bg-white/3{{ else }}bg-ink-100{{ end }}">
    <img src="{{ . }}" alt="" class="w-full h-full object-cover block" loading="lazy">
  </div>
  {{ end }}
  <div class="px-7 pt-7 pb-8">
    {{ with .eyebrow }}
    <div class="font-body text-xs font-semibold tracking-eyebrow uppercase mb-[0.6rem] {{ if $dark }}text-on-dark/62{{ else }}text-primary{{ end }}">{{ . }}</div>
    {{ end }}
    <h3 class="m-0 mb-2 font-display font-medium text-2xl tracking-tight {{ if $dark }}text-on-dark{{ else }}text-heading{{ end }}">{{ .title }}</h3>
    <p class="m-0 font-body text-base leading-relaxed {{ if $dark }}text-on-dark/62{{ else }}text-body{{ end }}">{{ .body }}</p>
  </div>
</a>
