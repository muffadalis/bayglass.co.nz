baseURL = "https://bayglass.co.nz/"
locale = "en-nz"
title = "Bay Glass"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
disableHugoGeneratorInject = true

[minify]
  disableJSON = false
  [minify.tdewolff.html]
    keepComments = false

# Hugo 0.158+ sandboxes the css.TailwindCSS subprocess and only runs binaries on
# this allow-list. The defaults (sass/go/git/node/postcss) don't include the
# Tailwind CLI, so the build fails without this. Keeps the defaults, adds
# tailwindcss + npx. Local and CI both run Hugo 0.165.0 extended.
[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^npx$', '^node$', '^postcss$', '^tailwindcss$', 'tailwindcss']


[params]
  # NAP — kept byte-identical with the Google Business Profile
  businessName = "Bay Glass"
  legalName = "Bay Glass Northland Ltd."
  phone = "09 407 9035"
  phoneHref = "tel:+6494079035"
